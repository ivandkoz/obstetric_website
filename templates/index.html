<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Оценка риска</title>
    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='style.css') }}"
    >

    <script
        src="{{ url_for('static', filename='script.js') }}"
        defer
    ></script>
</head>

<body>
    <main class="container">
        <h1>Выберите анкету</h1>
        <p>Выберите подходящую для вас анкету</p>
        {% for questionnaire, link in questionnaires_links.items() %}
            <section class="questionnaire-card">
                <h2>{{questionnaire}}</h2>
                <a class="questionnaire-link" href="{{ url_for(link) }}">Перейти к анкете</a>
            </section>
        {% endfor %}
    </main>
</body>
</html>
